<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0B1220">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a slot · Salon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;600&display=swap">
<style>
:root{--paper:#0B1220;--ink:#F7F9FC;--body:#B8C5D5;--muted:#8798AD;--soft:#111C2D;--card:#1E3045;--line:#304968;--accent:#91A7C0;--accent-h:#B0C3D8;color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--body);font:400 1rem/1.6 "Work Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
h1,h2,.logo,.ref,.day b{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;line-height:1;margin:0;letter-spacing:.01em;color:var(--ink)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:76rem;margin:0 auto;padding:0 1.25rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:4rem}
.logo{font-size:2rem;text-decoration:none}
.btn,.opt{display:inline-block;border:1px solid var(--accent);border-radius:999px;padding:.6rem 1.5rem;text-decoration:none;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.btn:hover{background:var(--accent-h);border-color:var(--accent-h);color:#0B1220}
.top{padding:2.5rem 0 .5rem}
h1{font-size:clamp(2.8rem,7vw,5rem)}
.steps{display:flex;gap:1.25rem;flex-wrap:wrap;list-style:none;padding:0;margin:1rem 0 0;color:var(--muted);font-size:.9rem}
.steps li{padding-bottom:.25rem;border-bottom:2px solid transparent}
.steps li.on{color:var(--ink);font-weight:600;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:3rem;align-items:start;padding:1.5rem 0 4rem}
main h2{font-size:1.7rem;margin:2rem 0 .8rem}
main h2:first-child{margin-top:0}
.muted{color:var(--muted)}
.svcs{display:grid;gap:.75rem}
.svc{display:grid;grid-template-columns:1fr auto;gap:.15rem 1rem;text-align:left;width:100%;padding:1rem 1.2rem;border:1px solid var(--line);border-radius:1rem;background:var(--soft);color:var(--body);font:inherit;cursor:pointer}
.svc b{font-weight:600;color:var(--ink);font-size:1.1rem}
.svc .m{grid-row:1;grid-column:2;color:var(--ink);white-space:nowrap}
.svc .d{grid-column:1/-1;font-size:.9rem}
.svc[aria-pressed="true"],.opt[aria-pressed="true"],.slot.sel{border-color:var(--accent);background:var(--accent);color:#0B1220}
.svc[aria-pressed="true"] b,.svc[aria-pressed="true"] .m{color:#0B1220}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.4rem,1fr));gap:.5rem}
.day{border-radius:1rem;text-align:center;padding:.5rem .2rem;font-size:.8rem}
.day b{display:block;font-size:1.7rem}
.opt:disabled,.slot:disabled{opacity:.3;cursor:not-allowed}
.grp{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:1.25rem 0 .5rem}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:.6rem}
.slot{border:1px solid var(--accent);border-radius:.8rem;background:transparent;color:var(--ink);font:inherit;padding:.65rem .3rem;cursor:pointer}
label{display:block;font-weight:600;color:var(--ink);margin:0 0 1rem}
input,textarea{display:block;width:100%;margin-top:.35rem;padding:.8rem;border:1px solid var(--line);border-radius:.7rem;background:var(--soft);color:var(--ink);font:inherit;font-weight:400}
textarea{min-height:5.5rem;resize:vertical}
input[aria-invalid="true"]{border-color:#e5484d}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{background:var(--soft);border-radius:.8rem;padding:.8rem 1rem;color:var(--muted);font-size:.9rem;margin:1.25rem 0 0}
.err{color:#ff7b80;min-height:1.4rem;margin:.5rem 0}
.r{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px dotted var(--line)}
.r b{color:var(--ink);text-align:right}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.25rem;margin-bottom:1.5rem}
.side{position:sticky;top:5.5rem;background:var(--card);border:1px solid var(--line);border-radius:1.25rem;padding:1.5rem}
.side h2{font-size:1.7rem;margin-bottom:.75rem}
.go{display:block;width:100%;text-align:center;background:var(--accent);color:#0B1220;border-color:var(--accent);margin-top:1rem}
.go:hover{background:var(--accent-h);color:#0B1220}
.go:disabled{opacity:.4;cursor:not-allowed}
.lnk{display:block;width:100%;margin-top:.6rem;background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer}
.mini{display:none;justify-content:space-between;gap:1rem;color:var(--ink)}
.done{max-width:36rem;margin:0 auto;text-align:center}
.badge{display:inline-block;border:1px solid #F5C26B;color:#F5C26B;border-radius:999px;padding:.2rem .9rem;font-size:.85rem;font-weight:600}
.ref{font-size:clamp(3rem,12vw,4.8rem);letter-spacing:.06em;margin:.6rem 0}
.done .r{text-align:left}
.linkrow{display:flex;gap:.5rem;margin:.5rem 0 1.25rem}
.linkrow input{margin:0;font-size:.85rem}
.acts{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.full{grid-column:1/-1}
@media (max-width:48rem){
 .grid{grid-template-columns:1fr;gap:1rem;padding-bottom:9rem}
 .days{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:.4rem}
 .day{flex:0 0 4.4rem}
 .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:25;border-radius:1.25rem 1.25rem 0 0;padding:1rem 1.25rem calc(1rem + env(safe-area-inset-bottom,0px))}
 .side h2,.side .r{display:none}
 .mini{display:flex}
 .go{margin-top:.7rem}
 .lnk{margin-top:.3rem}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="index.html">Salon</a><a class="btn" href="index.html">Back to site</a></div></header>
<div class="wrap">
 <div class="top"><h1>Book your slot</h1>
  <ol class="steps" aria-label="Progress"><li>1. Service</li><li>2. Date and time</li><li>3. Your details</li><li>4. Request sent</li></ol></div>
 <div class="grid">
  <main id="main" aria-live="polite"><p class="muted">Loading…</p></main>
  <aside class="side" id="side" hidden></aside>
 </div>
</div>

<script>
var C=null,TZ='Asia/Kolkata',reqId=0;
var S={step:1,svc:null,date:null,slot:null,slots:null,name:'',phone:'',notes:'',key:null,busy:false,res:null,msg:''};
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function parseD(s){var p=s.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12))}
function addDays(s,n){var d=parseD(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dow(s){return parseD(s).getUTCDay()}
function dfmt(s,o){o.timeZone='UTC';return parseD(s).toLocaleDateString('en-IN',o)}
function hm(iso){var h=0,m=0;new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(new Date(iso)).forEach(function(p){if(p.type==='hour')h=+p.value;if(p.type==='minute')m=+p.value});return{h:h,m:m}}
function tlabel(iso){var t=hm(iso);return(t.h%12||12)+':'+(t.m<10?'0':'')+t.m+' '+(t.h>=12?'pm':'am')}
function money(n){return'₹'+Number(n).toLocaleString('en-IN')}
function dur(m){return m<60?m+' min':Math.floor(m/60)+' hr'+(m%60?' '+(m%60)+' min':'')}
function svcById(id){for(var i=0;i<C.services.length;i++)if(C.services[i].id===id)return C.services[i];return null}
function dayOff(d){return C.closed_weekdays.indexOf(dow(d))>-1||C.days_off.indexOf(d)>-1}
function newKey(){try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}var s='';while(s.length<32)s+=Math.random().toString(36).slice(2);return s.slice(0,32)}
function cleanPhone(p){var d=String(p||'').replace(/[\s\-().]/g,'');if(d.indexOf('+91')===0)d=d.slice(3);else if(/^91\d{10}$/.test(d))d=d.slice(2);else if(/^0\d{10}$/.test(d))d=d.slice(1);return/^[6-9]\d{9}$/.test(d)?d:null}

function api(path,opts){return fetch(path,opts).then(function(r){return r.json().catch(function(){return{}}).then(function(d){return{ok:r.ok,status:r.status,data:d}})})}

function step1(){
  return '<h2>Choose a service</h2><div class="svcs">'+C.services.map(function(s){
    return '<button class="svc" data-svc="'+s.id+'" aria-pressed="'+(S.svc===s.id)+'"><b>'+esc(s.name)+'</b><span class="m">'+money(s.price)+' · '+dur(s.duration_minutes)+'</span><span class="d">'+esc(s.description)+'</span></button>'}).join('')+'</div>';
}
function step2(){
  var days='';for(var i=0;i<=C.max_advance_days;i++){var d=addDays(C.today,i),off=dayOff(d);
    days+='<button class="opt day" data-d="'+d+'"'+(off?' disabled':'')+' aria-pressed="'+(S.date===d)+'" aria-label="'+dfmt(d,{weekday:'long',day:'numeric',month:'long'})+(off?' (closed)':'')+'">'+dfmt(d,{weekday:'short'})+'<b>'+parseD(d).getUTCDate()+'</b>'+dfmt(d,{month:'short'})+'</button>'}
  var m=S.msg?'<p class="err" role="alert">'+esc(S.msg)+'</p>':'';S.msg='';
  return m+'<h2>Pick a day</h2><div class="days">'+days+'</div><h2>Available times</h2><div id="slotbox"></div>';
}
function paintSlots(){
  var b=$('slotbox');if(!b)return;
  if(S.slots==='loading'){b.innerHTML='<p class="muted">Checking availability…</p>';return}
  if(S.slots==='error'){b.innerHTML='<p class="err" role="alert">We couldn’t load the times. <button class="opt" id="retry-slots">Try again</button></p>';return}
  if(!S.slots||!S.slots.length){b.innerHTML='<p class="note">No times are free on this day. Please try another day.</p>';return}
  var out='';[['Morning',0,12],['Afternoon',12,17],['Evening',17,24]].forEach(function(g){
    var h=S.slots.filter(function(t){var x=hm(t).h;return x>=g[1]&&x<g[2]});if(!h.length)return;
    out+='<p class="grp">'+g[0]+'</p><div class="slots">'+h.map(function(t){return'<button class="slot'+(S.slot===t?' sel':'')+'" data-t="'+t+'" aria-pressed="'+(S.slot===t)+'">'+tlabel(t)+'</button>'}).join('')+'</div>'});
  b.innerHTML=out;
}
function rows(){
  var s=svcById(S.svc),r=function(a,b){return'<div class="r"><span>'+a+'</span><b>'+b+'</b></div>'};
  return r('Service',esc(s.name))+r('Price',money(s.price))+r('Duration',dur(s.duration_minutes))+
    (S.date?r('Date',dfmt(S.date,{weekday:'short',day:'numeric',month:'long'})):'')+(S.slot?r('Time',tlabel(S.slot)):'');
}
function step3(){
  if(!S.key)S.key=newKey();
  return '<h2>Your details</h2><div class="sumcard">'+rows()+'</div>'+
  '<label>Full name<input id="nm" autocomplete="name" maxlength="80" value="'+esc(S.name)+'"></label>'+
  '<label>Phone number<input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="98765 43210" value="'+esc(S.phone)+'"></label>'+
  '<label>Notes <span class="muted">(optional)</span><textarea id="nt" maxlength="500">'+esc(S.notes)+'</textarea></label>'+
  '<div class="hp" aria-hidden="true"><label>Website<input id="hp" tabindex="-1" autocomplete="off"></label></div>'+
  '<p class="note">This is a request, not a confirmed booking. The salon will review it and confirm or decline it.</p><p class="err" id="err" role="alert"></p>';
}
function statusLink(){return location.origin+'/status.html#ref='+encodeURIComponent(S.res.reference)+'&t='+encodeURIComponent(S.res.token)}
function step4(){
  var r=S.res,x=function(a,b){return'<div class="r"><span>'+a+'</span><b>'+b+'</b></div>'};
  return '<div class="done"><span class="badge">Pending · awaiting salon confirmation</span><div class="ref">'+esc(r.reference)+'</div>'+
  '<h2>Request received</h2><p>Your booking is <b>not confirmed yet</b>. The salon will confirm or decline it, and you can check the result with the link below.</p>'+
  x('Service',esc(r.service_name))+x('Price',money(r.price))+x('Duration',dur(r.duration_minutes))+x('Date',dfmt(S.date,{weekday:'short',day:'numeric',month:'long'}))+x('Time',tlabel(r.start))+
  '<p style="margin-top:1.5rem">Save this link. It’s the only way to check your request later.</p>'+
  '<div class="linkrow"><input id="lnk" readonly value="'+esc(statusLink())+'" aria-label="Status link"><button class="opt" id="cp">Copy</button></div>'+
  '<div class="acts"><a class="btn" href="'+esc(statusLink())+'">Check status</a><button class="opt" id="again">Make another request</button></div></div>';
}
function side(){
  var el=$('side');
  if(!C||S.step===4){el.hidden=true;return}
  el.hidden=false;
  var s=svcById(S.svc),mini,btn,back='';
  if(S.step===1){mini=[s?esc(s.name):'Choose a service',s?money(s.price):''];btn='<button class="btn go" id="next"'+(S.svc?'':' disabled')+'>Continue</button>'}
  else if(S.step===2){mini=[esc(s.name),S.slot?tlabel(S.slot):'Pick a time'];btn='<button class="btn go" id="next"'+(S.slot?'':' disabled')+'>Continue</button>';back='<button class="lnk" id="back">Change service</button>'}
  else{mini=[esc(s.name)+' · '+(S.date?dfmt(S.date,{day:'numeric',month:'short'}):''),S.slot?tlabel(S.slot):''];btn='<button class="btn go" id="req"'+(S.busy?' disabled':'')+'>'+(S.busy?'Sending request…':'Request Booking')+'</button>';back='<button class="lnk" id="back">Change date or time</button>'}
  el.innerHTML='<h2>Your booking</h2>'+(s?rows():'<p class="muted">Nothing selected yet.</p>')+'<div class="mini"><span>'+mini[0]+'</span><b>'+mini[1]+'</b></div>'+btn+back;
}
function render(){
  [].forEach.call(document.querySelectorAll('.steps li'),function(li,i){li.className=i+1===S.step?'on':''});
  var m=$('main');m.innerHTML=S.step===1?step1():S.step===2?step2():S.step===3?step3():step4();
  m.classList.toggle('full',S.step===4);
  if(S.step===2)paintSlots();
  side();
}
function go(n){
  S.step=n;
  if(n===2){if(!S.date||dayOff(S.date)){S.date=null;for(var i=0;i<=C.max_advance_days;i++){var d=addDays(C.today,i);if(!dayOff(d)){S.date=d;break}}}}
  render();window.scrollTo(0,0);
  if(n===2)fetchSlots();
}

function fetchSlots(){
  if(!S.date)return;
  var id=++reqId;S.slots='loading';paintSlots();
  api('/api/slots?service='+encodeURIComponent(S.svc)+'&date='+S.date).then(function(r){
    if(id!==reqId)return;
    S.slots=r.ok&&Array.isArray(r.data.slots)?r.data.slots:'error';
    if(S.slot&&(!Array.isArray(S.slots)||S.slots.indexOf(S.slot)<0))S.slot=null;
    paintSlots();side();
  }).catch(function(){if(id!==reqId)return;S.slots='error';paintSlots()});
}
function loadConfig(){
  $('main').innerHTML='<p class="muted">Loading services…</p>';
  api('/api/config').then(function(r){
    if(!r.ok||!r.data.services)throw 0;
    C=r.data;TZ=C.timezone;
    if(!C.services.length){$('main').innerHTML='<p class="note">No services are available to book right now. Please check back soon.</p>';return}
    render();
  }).catch(function(){$('main').innerHTML='<p class="err" role="alert">We couldn’t load the services. <button class="opt" id="retry-cfg">Try again</button></p>'});
}

function submit(){
  if(S.busy)return;
  var nm=$('nm').value.trim(),ph=cleanPhone($('ph').value),er=$('err');
  $('nm').removeAttribute('aria-invalid');$('ph').removeAttribute('aria-invalid');
  if(nm.length<2){er.textContent='Please enter your full name.';$('nm').setAttribute('aria-invalid','true');$('nm').focus();return}
  if(!ph){er.textContent='Enter a valid 10-digit Indian mobile number.';$('ph').setAttribute('aria-invalid','true');$('ph').focus();return}
  er.textContent='';S.busy=true;side();
  api('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    service_id:S.svc,start:S.slot,name:nm,phone:ph,notes:S.notes.trim(),idempotency_key:S.key,website:$('hp').value})}).then(function(r){
    S.busy=false;
    if(r.ok){S.res=r.data;S.key=null;S.step=4;render();window.scrollTo(0,0);return}
    var e=r.data&&r.data.error;
    if(e==='slot_unavailable'){S.slot=null;S.msg='Sorry, that time was just taken. Please choose another.';go(2);return}
    side();er=$('err');
    er.textContent=e==='rate_limited'?'Too many requests. Please wait a while, or call the salon.':
      e==='invalid_phone'?'Enter a valid 10-digit Indian mobile number.':e==='invalid_name'?'Please enter your full name.':
      'Something went wrong on our side. Please try again in a moment.';
  }).catch(function(){S.busy=false;side();$('err').textContent='Network problem. Your request was not sent. Please check your connection and try again.'});
}

$('main').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.svc){if(S.svc!==b.dataset.svc){S.svc=b.dataset.svc;S.slot=null;S.slots=null}
    [].forEach.call(document.querySelectorAll('[data-svc]'),function(x){x.setAttribute('aria-pressed',x.dataset.svc===S.svc)});side()}
  else if(b.dataset.d){S.date=b.dataset.d;S.slot=null;
    [].forEach.call(document.querySelectorAll('[data-d]'),function(x){x.setAttribute('aria-pressed',x.dataset.d===S.date)});side();fetchSlots()}
  else if(b.dataset.t){S.slot=b.dataset.t;paintSlots();side()}
  else if(b.id==='retry-slots')fetchSlots();
  else if(b.id==='retry-cfg')loadConfig();
  else if(b.id==='cp'){var i=$('lnk');i.select();try{navigator.clipboard.writeText(i.value);b.textContent='Copied'}catch(x){document.execCommand&&document.execCommand('copy')}}
  else if(b.id==='again')location.href='book.html';
});
$('main').addEventListener('input',function(e){
  var id=e.target.id;if(id==='nm')S.name=e.target.value;else if(id==='ph')S.phone=e.target.value;else if(id==='nt')S.notes=e.target.value;
});
$('side').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.id==='next')go(S.step+1);
  else if(b.id==='back')go(S.step-1);
  else if(b.id==='req')submit();
});
loadConfig();
</script>
</body>
</html>
